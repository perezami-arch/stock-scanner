name: Research and lifecycle contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==3.0.1 requests tzdata
      - run: python -B -W ignore::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -q
      - name: Validate Jerusalem schedules without enabling them
        run: |
          systemd-analyze calendar 'Mon *-*-* 09:00:00 Asia/Jerusalem'
          systemd-analyze calendar '*-*-* 08:24:00 Asia/Jerusalem'
